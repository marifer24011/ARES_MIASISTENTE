<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Asistente | Registro</title>
    <link rel="icon" type="image/png" href="/img/logoares.png" >
     <link rel="stylesheet" href="css/registro.css"> 

</head>

<body>

    <main class="contenedor-registro">

        <div class="tarjeta-registro">

            <img 
                src="img/logotsj.jpg"
                alt="Tecnologico Superior de Jalisco"
                class="logo-institucional">

            <h3>Crear cuenta</h3>

        

            <form id="form-registro">

                <!-- Nombre Completo -->
                <div class="campo-nombre">
                    <label for="nombre">Nombre Completo</label>
                    <img src="img/icon-usuario.png" alt="" class="icon-usuario">
                    <input type="text" id="nombre" name="nombre"
                        placeholder="Usuario"
                        minlength="2" maxlength="150" required />
                </div>

                <!-- Correo electronico -->
                <div class="campo-correo">
                    <label for="correo">Correo Institucional</label>
                    <img src="img/icon-correo.png" alt="" class="icon-correo">
                    <input type="email" id="correo" name="correo"
                        pattern=".+@zapopan.tecmm.edu.mx"  
                        placeholder="usuario@zapopan.tecmm.edu.mx" required />
                </div>

                <!-- Contraseña -->
                <div class="campo-contrasena">
                    <label for="contrasena">Contraseña</label>
                    <img src="img/icon-contrasena.png" alt="" class="icon-contrasena">
                    <input type="password" id="contrasena" name="contrasena"
                        placeholder="Mínimo 8 caracteres"
                        minlength="8" maxlength="128" required />
                </div>

                <button type="submit">
                    Registrarse
                </button>

                <p id="mensaje-registro" role="status" aria-live="polite"></p>

            </form>

            <p>¿Ya tienes cuenta? <a href="/">Iniciar sesión</a></p>

        </div>

    </main>

    <script src="/js/registro.js"></script>

</body>
</html>
