<!DOCTYPE html>
<html lang="es">
    
<head>
    <meta charset="UTF-8">
    <title>Mi Asistente</title>
    <link rel="icon" type="image/png" href="/img/logoares.png" >
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="login-container">

      <img
        src="img/logotsj.jpg"
        alt="Tecnológico Superior de Jalisco"
        class="logo-institucional">

    <form id="form-login">

        <h3>Bienvenido a Mi Asistente</h3>

        <div class="campo-correo">

            <label for="email"></label>

            <img src="img/icon-correo.png" alt="" class="icon-correo">

            <input type="email" id="email" 
              pattern=".+@zapopan.tecmm.edu.mx"  
              placeholder="Correo electrónico" required />
        </div>
        <br>

<!--Crear login-->
        <div class="campo-contrasena">

            <label for="password"></label>

            <img src="img/icon-contrasena.png" alt="" class="icon-contrasena">

            <input type="password" id="password" 
            placeholder="Contraseña" required/>
        </div>
        <br>
        <button class="iniciar-sesion" type="submit">Iniciar Sesión</button>


        

    </form>

<!-- Separador entre los botones -->
<div class="separador">
  <span>o continúa con</span>
</div>

<!--Boton Google-->
<script src="https://accounts.google.com/gsi/client" async></script>

    <script>
      function decodeJWT(token) {

        let base64Url = token.split(".")[1];
        let base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
        let jsonPayload = decodeURIComponent(
          atob(base64)
            .split("")
            .map(function (c) {
              return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
            })
            .join("")
        );
        return JSON.parse(jsonPayload);
      }

      function handleCredentialResponse(response) {

        console.log("Encoded JWT ID token: " + response.credential);

        const responsePayload = decodeJWT(response.credential);

        console.log("Decoded JWT ID token fields:");
        console.log("  Full Name: " + responsePayload.name);
        console.log("  Given Name: " + responsePayload.given_name);
        console.log("  Family Name: " + responsePayload.family_name);
        console.log("  Unique ID: " + responsePayload.sub);
        console.log("  Profile image URL: " + responsePayload.picture);
        console.log("  Email: " + responsePayload.email);
      }
    </script>
    <!-- g_id_onload contains Google Identity Services settings -->
    <div
      id="g_id_onload"
      data-auto_prompt="false"
      data-callback="handleCredentialResponse"
      data-client_id="1042749503975-8igibl21lgsp49n1atcubh232fk7hh06.apps.googleusercontent.com"
    ></div>
    <!-- g_id_signin places the button on a page and supports customization -->

    <div
      class="g_id_signin"
      data-type="standard"
      data-theme="outline"
      data-size="large"
      data-text="signin_with"
      data-shape="rectangular"
      data-logo_alignment="left"
      data-width="250">
    </div>

    </div> <!-- Fin de login-container -->

    <script src="/js/login.js"></script>

</body>
</html>
